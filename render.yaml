# Render Blueprint — WhatsApp CRM
# Repo root must contain this file. Render reads it when you pick
# "New + -> Blueprint" and connect this repository.
#
# Creates ONE web service that serves both the API and the static frontend
# (FastAPI mounts frontend/ — see backend/app/main.py).
services:
  - type: web
    name: whatsapp-crm
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Change to a long random value (openssl rand -hex 32).
      - key: SECRET_KEY
        generateValue: true
      # Set in the Render dashboard after deploy (secrets):
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_BUCKET
        value: whatsapp-media
