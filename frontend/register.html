<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - WhatsApp CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="auth-card glass">
    <div class="auth-brand">
      <div class="logo-badge">💬</div>
      <h1>WhatsApp CRM</h1>
      <p>Create your workspace in seconds.</p>
    </div>

    <form id="register-form" class="auth-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Jane Doe" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
        <small class="hint">At least 8 characters.</small>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="register-btn">
        <span class="btn-label">Create account</span>
      </button>

      <div class="form-error" id="form-error" hidden></div>
    </form>

    <p class="auth-alt">
      Already registered? <a href="index.html">Sign in</a>
    </p>
  </main>

  <div class="theme-switch" id="theme-switch" title="Toggle theme">🌙</div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
