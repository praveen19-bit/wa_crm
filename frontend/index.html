<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - WhatsApp CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="auth-card glass">
    <div class="auth-brand">
      <div class="logo-badge">💬</div>
      <h1>WhatsApp CRM</h1>
      <p>Cold DM conversations, on autopilot.</p>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <span class="btn-label">Sign in</span>
      </button>

      <div class="form-error" id="form-error" hidden></div>
    </form>

    <p class="auth-alt">
      Don't have an account? <a href="register.html">Create one</a>
    </p>
    <p class="auth-meta">
      API base: <code id="api-base-label">http://127.0.0.1:8000</code>
    </p>
  </main>

  <div class="theme-switch" id="theme-switch" title="Toggle theme">🌙</div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
